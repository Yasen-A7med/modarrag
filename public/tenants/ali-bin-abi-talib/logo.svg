    <path d="M34 53 C29 50 28 44 32 41 C36 44 37 49 34 53 Z" />
    <path d="M33 61 C27 59 25 53 29 49 C33 52 35 57 33 61 Z" />
    <path d="M33.5 69 C27 68.5 25 63 28.5 59 C32.5 61 35 65 33.5 69 Z" />
    <path d="M35.5 77.5 C29 78 26.5 73 29.5 68.5 C33.5 70 36.5 73.5 35.5 77.5 Z" />
    <path d="M39 85.5 C33 87 29.5 82.5 32.5 77.5 C36.5 78.5 39.5 81.5 39 85.5 Z" />
    <path d="M44 92.5 C39 95 34.5 91.5 37 86.5 C40.5 86.5 43.5 89 44 92.5 Z" />
  </g>

  <!-- Symmetrical Academic Olive Wreath (Right Branch) -->
  <g fill="#D97706">
    <path d="M88 88 C95 78 97 66 94 53" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" />
    <path d="M94 53 C99 50 100 44 96 41 C92 44 91 49 94 53 Z" />
    <path d="M95 61 C101 59 103 53 99 49 C95 52 93 57 95 61 Z" />
    <path d="M94.5 69 C101 68.5 103 63 99.5 59 C95.5 61 93 65 94.5 69 Z" />
    <path d="M92.5 77.5 C99 78 101.5 73 98.5 68.5 C94.5 70 91.5 73.5 92.5 77.5 Z" />
    <path d="M89 85.5 C95 87 98.5 82.5 95.5 77.5 C91.5 78.5 88.5 81.5 89 85.5 Z" />
    <path d="M84 92.5 C89 95 93.5 91.5 91 86.5 C87.5 86.5 84.5 89 84 92.5 Z" />
  </g>

  <!-- Wreath Base Tie -->
  <path d="M46 94 Q64 102 82 94" fill="none" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="64" cy="98.5" r="2.6" fill="#F59E0B" />

  <!-- Open Academic Book (Crisp Architectural Geometry) -->
