<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="modarrag-school-emblem-title">
  <title id="modarrag-school-emblem-title">Official Academic School Emblem</title>
  <defs>
    <linearGradient id="navy-shield" x1="64" y1="8" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#13255E" />
    </linearGradient>
    <linearGradient id="gold-trim" x1="20" y1="12" x2="108" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Outer Architectural Shield Badge -->
  <path
    d="M64 8 L108 22 V62 C108 90.5 89.2 110.8 64 120 C38.8 110.8 20 90.5 20 62 V22 Z"
    fill="url(#navy-shield)"
    stroke="url(#gold-trim)"
    stroke-width="3.5"
    stroke-linejoin="round"
  />
  <!-- Inner Precision Hairline Frame -->
  <path
    d="M64 15.5 L100.5 27.2 V61.5 C100.5 85.8 84.8 103.4 64 111.8 C43.2 103.4 27.5 85.8 27.5 61.5 V27.2 Z"
    fill="none"
    stroke="#D97706"
    stroke-opacity="0.48"
    stroke-width="1.25"
    stroke-linejoin="round"
  />

  <!-- Architectural Amphitheater Arch & Keystone Accent -->
  <path
    d="M42 54 V43 C42 30.85 51.85 21 64 21 C76.15 21 86 30.85 86 43 V54"
    fill="none"
    stroke="url(#gold-trim)"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <polygon points="64,17 67.5,22.5 64,26.5 60.5,22.5" fill="#F59E0B" />

  <!-- Symmetrical Academic Olive Wreath (Left Branch) -->
  <g fill="#D97706">
