    <path
      d="M83.5 56 C78 54.8 73 55.2 68.5 57.2 M83.5 62 C78 60.8 73 61.2 68.5 63.2 M83.5 68 C78 66.8 73 67.2 68.5 69.2"
      fill="none"
      stroke="#1E3A8A"
      stroke-opacity="0.35"
      stroke-width="1.5"
      stroke-linecap="round"
    />
