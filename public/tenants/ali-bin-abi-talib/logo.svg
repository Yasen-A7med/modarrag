      stroke-linejoin="round"
    />
    <!-- Center Spine -->
    <line x1="64" y1="52" x2="64" y2="83.5" stroke="#1E3A8A" stroke-width="1.8" stroke-linecap="round" />
    <!-- Subtle Page Ruled Lines -->
    <path
